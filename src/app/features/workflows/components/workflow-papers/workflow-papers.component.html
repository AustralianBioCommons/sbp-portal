@for (citation of resolvedCitations(); track citation.key) {
<div class="space-y-2">
  <h3 class="font-medium text-gray-900">{{ citation.label }}</h3>
  <p>
    {{ formatCitation(citation) }}
    <a
      [href]="getCitationHref(citation)"
      target="_blank"
      rel="noopener noreferrer"
      class="wrap-break-word text-sky-700 underline hover:text-sky-800"
      >{{ citation.doi }}<span class="sr-only"> (opens in a new tab)</span></a
    >
  </p>
</div>
}
