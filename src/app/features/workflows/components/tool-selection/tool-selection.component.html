<div class="flex flex-wrap gap-4">
  @for (tool of tools(); track tool.id) {
  <label
    class="flex items-center cursor-pointer gap-2 border rounded-full p-2 pr-3 transition-all hover:bg-gray-50"
    [class]="
      selectedToolId() === tool.id ? 'border-gray-900' : 'border-gray-300'
    "
  >
    <input
      type="radio"
      name="selectedTool"
      [value]="tool.id"
      [checked]="selectedToolId() === tool.id"
      (change)="onToolSelect(tool.id)"
      class="sr-only"
    />
    <div
      class="w-5 h-5 rounded-full border-2 flex items-center justify-center transition-all border-sky-500 bg-white"
    >
      @if (selectedToolId() === tool.id) {
      <div class="w-2 h-2 rounded-full bg-sky-500"></div>
      }
    </div>
    <span class="text-sm">
      <span class="font-semibold">{{ tool.label }}</span>
      @if (tool.credits !== undefined) {
      <span class="text-gray-500">
        from {{ tool.credits }}
        {{ tool.credits === 1 ? "credit" : "credits" }}
      </span>
      }
    </span>
  </label>
  } @empty {
  <div class="text-center py-4">
    <span class="text-sm text-gray-500">No tools available</span>
  </div>
  }
</div>
