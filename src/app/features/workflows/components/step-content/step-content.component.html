<div class="p-4">
  @if (heading()) {
    <div class="text-lg font-semibold text-gray-900">
      @if (step() !== undefined) {
        Step {{ step() }} —
      }
      {{ heading() }}
    </div>
  }
  @if (description()) {
    <p class="mt-2 mb-4 text-sm text-gray-500">{{ description() }}</p>
  }
  <div [class]="contentClass()">
    <ng-content></ng-content>
  </div>
</div>
