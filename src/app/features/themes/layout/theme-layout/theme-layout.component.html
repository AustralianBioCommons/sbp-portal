<div
  class="bg-gray-100 bg-[url('/assets/themes-bg.avif')] bg-size-[100%_600px] bg-fixed bg-top bg-no-repeat xl:bg-size-[100%_40vw]"
>
  <div class="mx-auto max-w-7xl px-6 py-12">
    <div class="space-y-12 rounded-lg border bg-white p-6 shadow-sm sm:p-12">
      <!-- Title + projected intro copy -->
      <div class="space-y-6">
        <h1 class="text-4xl leading-none font-semibold">{{ heading() }}</h1>
        <ng-content select="[description]"></ng-content>
      </div>

      <!-- Workflows -->
      <div class="space-y-6">
        <h2 class="text-2xl leading-none font-semibold">Workflows</h2>
        <div class="grid grid-cols-1 gap-6 md:grid-cols-2 lg:grid-cols-3">
          @for (workflow of workflows(); track workflow.id) {
            <a
              [routerLink]="workflow.disabled ? null : workflow.href"
              class="group flex flex-col gap-4 rounded-lg border p-6 text-inherit no-underline shadow-sm motion-reduce:transition-none"
              [class]="
                workflow.disabled
                  ? 'cursor-not-allowed bg-gray-100 opacity-50'
                  : 'bg-white transition-all hover:shadow-md motion-safe:hover:-translate-y-0.5'
              "
            >
              <h3 class="text-lg font-semibold">
                {{ workflow.label }}
              </h3>

              @if (workflow.tools.length) {
                <div class="space-y-2">
                  <p class="text-xs font-medium text-gray-500 uppercase">
                    Tools
                  </p>
                  <ul class="flex list-none flex-wrap gap-2">
                    @for (tool of workflow.tools; track tool.id) {
                      <li>
                        <span
                          class="inline-flex items-center rounded-full bg-gray-200 px-2 py-1 font-mono text-xs font-semibold"
                          [attr.aria-label]="
                            tool.disabled ? tool.label + ' (coming soon)' : null
                          "
                        >
                          {{ tool.label }}
                        </span>
                      </li>
                    }
                  </ul>
                </div>
              }

              <div
                class="mt-auto flex items-center justify-start gap-2 text-sm font-semibold text-sky-600 transition-colors group-hover:text-sky-700"
              >
                View workflow
                <span
                  class="inline-flex shrink-0 items-center justify-center rounded-full bg-sky-100 p-1 text-sky-800"
                  aria-hidden="true"
                >
                  <ng-icon name="heroArrowRight" size="16" />
                </span>
              </div>
            </a>
          }
        </div>
      </div>

      <!-- Theme-specific extras (e.g. community resources) -->
      <ng-content></ng-content>
    </div>
  </div>
</div>
