<div
  class="bg-gray-100 bg-[url('/assets/themes-bg.png')] bg-no-repeat bg-size-[100%_auto] bg-top bg-fixed"
>
  <div class="max-w-7xl px-6 mx-auto py-12">
    <div class="bg-white rounded-lg shadow-sm border p-12 space-y-12">
      <!-- Title + projected intro copy -->
      <div class="space-y-6">
        <h1 class="text-4xl font-semibold">{{ title() }}</h1>
        <ng-content select="[description]"></ng-content>
      </div>

      <!-- Workflows -->
      <div class="space-y-6">
        <h2 class="text-2xl font-semibold">Workflows</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
          @for (workflow of workflows(); track workflow.id) {
          <a
            [routerLink]="workflow.disabled ? null : workflow.href"
            class="group rounded-xl border shadow-sm p-6 flex flex-col gap-4 no-underline text-inherit"
            [class]="
              workflow.disabled
                ? 'bg-gray-100 opacity-50 cursor-not-allowed'
                : 'bg-white hover:shadow-md hover:-translate-y-0.5 transition-all'
            "
          >
            <h3 class="text-lg font-semibold">{{ workflow.label }}</h3>

            @if (workflow.tools.length) {
            <div class="space-y-2">
              <p class="text-xs uppercase font-semibold text-gray-500">Tools</p>
              <ul class="flex flex-wrap gap-2 list-none">
                @for (tool of workflow.tools; track tool.id) {
                <li>
                  <span
                    class="inline-flex items-center px-3 py-1 text-xs font-mono font-semibold border rounded-full"
                    [class]="
                      tool.disabled
                        ? 'bg-gray-100 text-gray-400 border-gray-400'
                        : 'text-gray-900 border-gray-900'
                    "
                    [attr.aria-label]="
                      tool.disabled ? tool.label + ' (coming soon)' : null
                    "
                  >
                    {{ tool.label }}
                  </span>
                </li>
                }
              </ul>
            </div>
            }

            <div
              class="flex justify-start items-center gap-1 text-sm font-semibold text-biocommons-primary transition-colors group-hover:text-sky-700"
            >
              Launch workflow
              <ng-icon name="heroChevronRight" size="16" />
            </div>
          </a>
          }
        </div>
      </div>

      <!-- Theme-specific extras (e.g. community resources) -->
      <ng-content></ng-content>
    </div>
  </div>
</div>
