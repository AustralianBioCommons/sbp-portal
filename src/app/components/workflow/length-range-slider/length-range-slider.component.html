<div class="w-full">
  <div class="grid w-full h-6 items-center">
    <div
      class="col-start-1 row-start-1 h-1.5 rounded-full bg-gray-200 pointer-events-none"
    ></div>
    <div
      class="col-start-1 row-start-1 h-1.5 rounded-full bg-sky-500 pointer-events-none"
      [style.margin-left.%]="fillLeft()"
      [style.margin-right.%]="fillRight()"
    ></div>

    <input
      type="range"
      aria-label="Minimum length"
      class="col-start-1 row-start-1 m-0 p-0 h-6 w-full appearance-none bg-transparent pointer-events-none [&::-webkit-slider-thumb]:appearance-none [&::-webkit-slider-thumb]:pointer-events-auto [&::-webkit-slider-thumb]:h-4 [&::-webkit-slider-thumb]:w-4 [&::-webkit-slider-thumb]:cursor-pointer [&::-webkit-slider-thumb]:rounded-full [&::-webkit-slider-thumb]:border-2 [&::-webkit-slider-thumb]:border-white [&::-webkit-slider-thumb]:bg-sky-500 [&::-webkit-slider-thumb]:shadow [&::-moz-range-thumb]:pointer-events-auto [&::-moz-range-thumb]:h-4 [&::-moz-range-thumb]:w-4 [&::-moz-range-thumb]:cursor-pointer [&::-moz-range-thumb]:rounded-full [&::-moz-range-thumb]:border-2 [&::-moz-range-thumb]:border-white [&::-moz-range-thumb]:bg-sky-500 [&::-moz-range-thumb]:shadow disabled:[&::-webkit-slider-thumb]:cursor-not-allowed disabled:[&::-webkit-slider-thumb]:bg-gray-400 disabled:[&::-moz-range-thumb]:cursor-not-allowed disabled:[&::-moz-range-thumb]:bg-gray-400"
      [min]="_min()"
      [max]="_max()"
      [value]="currentMin()"
      [disabled]="disabled()"
      (input)="onMinInput($event)"
    />

    <input
      type="range"
      aria-label="Maximum length"
      class="col-start-1 row-start-1 m-0 p-0 h-6 w-full appearance-none bg-transparent pointer-events-none [&::-webkit-slider-thumb]:appearance-none [&::-webkit-slider-thumb]:pointer-events-auto [&::-webkit-slider-thumb]:h-4 [&::-webkit-slider-thumb]:w-4 [&::-webkit-slider-thumb]:cursor-pointer [&::-webkit-slider-thumb]:rounded-full [&::-webkit-slider-thumb]:border-2 [&::-webkit-slider-thumb]:border-white [&::-webkit-slider-thumb]:bg-sky-500 [&::-webkit-slider-thumb]:shadow [&::-moz-range-thumb]:pointer-events-auto [&::-moz-range-thumb]:h-4 [&::-moz-range-thumb]:w-4 [&::-moz-range-thumb]:cursor-pointer [&::-moz-range-thumb]:rounded-full [&::-moz-range-thumb]:border-2 [&::-moz-range-thumb]:border-white [&::-moz-range-thumb]:bg-sky-500 [&::-moz-range-thumb]:shadow disabled:[&::-webkit-slider-thumb]:cursor-not-allowed disabled:[&::-webkit-slider-thumb]:bg-gray-400 disabled:[&::-moz-range-thumb]:cursor-not-allowed disabled:[&::-moz-range-thumb]:bg-gray-400"
      [min]="_min()"
      [max]="_max()"
      [value]="currentMax()"
      [disabled]="disabled()"
      (input)="onMaxInput($event)"
    />
  </div>
  <div class="flex items-center justify-between gap-4">
    <div class="text-xs text-gray-500">
      Min length:
      <span class="font-medium text-gray-900">{{ currentMin() }}</span>
    </div>
    <div class="text-xs text-gray-500">
      Max length:
      <span class="font-medium text-gray-900">{{ currentMax() }}</span>
    </div>
  </div>
</div>
