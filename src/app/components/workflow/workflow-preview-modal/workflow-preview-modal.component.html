<app-modal
  [isOpen]="isOpen()"
  [dismissible]="!isSubmitting()"
  ariaLabelledby="workflow-preview-title"
  panelClass="w-11/12 max-w-3xl"
  (dismissed)="onCancel()"
>
  <div modalHeader class="flex items-center justify-between gap-4 border-b p-4">
    <h2 id="workflow-preview-title" class="text-lg font-semibold text-gray-900">
      {{ title() }}
    </h2>
    <button
      type="button"
      class="flex h-8 w-8 shrink-0 items-center justify-center rounded-lg text-gray-400 transition-colors hover:bg-gray-100 hover:text-gray-600 focus:outline-none focus:ring-2 focus:ring-sky-100 disabled:cursor-not-allowed disabled:opacity-50"
      aria-label="Close preview"
      [disabled]="isSubmitting()"
      (click)="onCancel()"
    >
      <ng-icon name="heroXMark" class="h-5 w-5" aria-hidden="true" />
    </button>
  </div>

  <div modalBody class="max-h-[70vh] overflow-y-auto p-4">
    <app-configuration-summary
      [workflowName]="workflowName()"
      [selectedTool]="selectedTool()"
      [hasParameters]="hasParameters()"
      [inputItems]="inputItems()"
      [toolSettingItems]="toolSettingItems()"
    ></app-configuration-summary>
  </div>

  <div
    modalActions
    class="flex justify-end gap-4 border-t bg-gray-50 p-4 text-sm"
  >
    <app-button
      variant="secondary"
      widthClass="w-auto"
      [disabled]="isSubmitting()"
      (click)="onCancel()"
    >
      Cancel
    </app-button>
    <app-button
      variant="primary"
      widthClass="w-auto"
      [loading]="isSubmitting()"
      (click)="onConfirm()"
    >
      {{ confirmLabel() }}
    </app-button>
  </div>
</app-modal>
