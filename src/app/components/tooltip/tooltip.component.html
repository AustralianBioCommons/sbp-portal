<!-- Trigger: projected content, or the default info icon button -->
<!-- eslint-disable-next-line @angular-eslint/template/interactive-supports-focus -->
<div
  class="flex items-center"
  (mouseenter)="show($event)"
  (mouseleave)="open.set(false)"
  (focusin)="show($event)"
  (focusout)="open.set(false)"
  (keydown.escape)="open.set(false)"
>
  <ng-content>
    <button
      type="button"
      class="flex items-center rounded-full focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-sky-500"
      aria-label="More information"
      [attr.aria-describedby]="tooltipId"
    >
      <ng-icon
        name="heroInformationCircle"
        size="18"
        [class]="iconColor() + ' transition-all hover:cursor-pointer'"
      ></ng-icon>
    </button>
  </ng-content>
  <!-- Tooltip -->
  @if (open()) {
    <div
      [id]="tooltipId"
      role="tooltip"
      class="fixed left-(--tooltip-x) z-1000 w-max max-w-48 translate-x-(--tooltip-shift) rounded-md bg-gray-900 px-3 py-2 text-xs whitespace-pre-line text-white opacity-95 shadow-lg [--tooltip-shift:clamp(calc(8px-var(--tooltip-x)),-50%,calc(100vw-100%-var(--tooltip-x)-8px))] before:absolute before:inset-x-0 before:-top-2 before:h-2 sm:max-w-56 md:max-w-64 lg:max-w-72"
      [style.--tooltip-x]="left() + 'px'"
      [style.top.px]="top()"
    >
      <span class="wrap-break-word">{{ message() }}</span>
      <div
        class="absolute top-0 -left-(--tooltip-shift) h-2 w-2 -translate-x-1/2 -translate-y-1 rotate-45 bg-gray-900"
      ></div>
    </div>
  }
</div>
