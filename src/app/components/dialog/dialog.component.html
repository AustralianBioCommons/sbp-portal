<app-modal
  [isOpen]="isOpen()"
  [dismissible]="!loading()"
  [ariaLabelledby]="title() ? 'dialog-title' : null"
  (dismissed)="onCancel()"
>
  <!-- Dialog Header: optional danger icon + title -->
  <div modalHeader class="p-6 pb-2 space-y-2 text-center">
    @if (variant() === "danger") {
    <span
      class="mx-auto flex h-12 w-12 items-center justify-center rounded-full bg-red-100 text-red-800"
    >
      <ng-icon name="heroExclamationTriangle" size="24" aria-hidden="true" />
    </span>
    }

    <div id="dialog-title" class="text-2xl font-semibold">
      {{ title() }}
    </div>
  </div>

  <!-- Dialog Content -->
  <div modalBody class="px-6 pb-6 text-center">
    <p class="text-gray-500">{{ message() }}</p>
  </div>

  <!-- Dialog Actions -->
  <div
    modalActions
    class="p-4 text-sm border-t flex justify-end gap-4 bg-gray-50"
  >
    <app-button variant="secondary" [disabled]="loading()" (click)="onCancel()">
      {{ cancelText() }}
    </app-button>

    <app-button
      variant="primary"
      [loading]="loading()"
      [colorClasses]="
        variant() === 'danger' ? 'bg-red-600 enabled:hover:bg-red-700' : ''
      "
      (click)="onConfirm()"
    >
      {{ confirmText() }}
    </app-button>
  </div>
</app-modal>
