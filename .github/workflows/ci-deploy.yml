# Build verification only. The portal itself is released to S3 + CloudFront by
# build_and_deploy.yml, which injects per-environment config at release time.
# The public project page at https://australianbiocommons.github.io/sbp-portal/
# is a static page published to the `gh-pages` branch by pages.yml.
name: CI / Build

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install dependencies
        run: |
          npm ci

      - name: Build
        run: |
          npm run build --if-present

      - name: Upload production artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
